name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest
            docker network create todo-net || true
            docker stop mongo || true
            docker rm mongo || true
            docker run -d --name mongo --network todo-net mongo:6
            docker stop todo-app || true
            docker rm todo-app || true
            docker run -d --name todo-app --network todo-net -p 3000:3000 -e MONGO_URL=mongodb://mongo:27017/tododb ${{ secrets.DOCKERHUB_USERNAME }}/todo-app:latest
